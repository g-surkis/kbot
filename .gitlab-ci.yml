spec:  
  inputs:
    os:
      default: "linux"
      options: ["linux", "darwin", "windows"]
      description: "Target operating system"
    arch:
      default: "amd64"
      options: ["amd64", "arm64"]
      description: "Target architecture"
    skip_tests:
      default: "false"
      options: ["true", "false"]
      description: "Skip running tests"
    skip_lint:
      default: "false"
      options: ["true", "false"]
      description: "Skip running linter"

variables:
  GIT_DEPTH: 0
  OS: "$[[ inputs.os ]]"
  ARCH: "$[[ inputs.arch ]]"
  SKIP_TESTS: "$[[ inputs.skip_tests ]]"
  SKIP_LINT: "$[[ inputs.skip_lint ]]"

default:
  image: golang:1.27.3
  before_script:
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - which make || (apt-get update -qq && apt-get install -y -qq make)
    - which golint || go install golang.org/x/lint/golint@latest

stages:
  - lint
  - test
  - build

lint-app:
  stage: lint
  script: make lint
  rules:
    - if: $SKIP_LINT == "true"
      when: never
    - when: on_success

test-app:
  stage: test
  script: make test
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - when: on_success

build-app:
  stage: build
  script: make build TARGETOS=$OS TARGETARCH=$ARCH
  artifacts:
    paths:
      - kbot